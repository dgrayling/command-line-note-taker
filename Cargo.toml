[package]
name = "command-line-note-taker"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = "0.4.45"
clap = { version = "4.6.8", features = ["derive"] }
dirs = "7.0.0"
rusqlite = { version = "0.43.0", features = ["bundled"] }

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
tempfile = "3.27.0"

[[bin]]
name = "note"
path = "src/main.rs"
